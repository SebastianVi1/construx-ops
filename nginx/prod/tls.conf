# Shared TLS settings, included by every HTTPS server.
# "current" is a symlink kept by 40-certs.sh: the Let's Encrypt cert once issued, a self-signed one until then.
ssl_certificate /etc/nginx/ssl/current/fullchain.pem;
ssl_certificate_key /etc/nginx/ssl/current/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

add_header Strict-Transport-Security "max-age=31536000" always;
